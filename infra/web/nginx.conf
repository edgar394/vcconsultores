# Sirve el dist/ de Astro. TLS, compresión y cabeceras de seguridad las pone Caddy por
# delante; aquí solo va lo que depende de los archivos: caché, 404 y las URLs del WordPress
# anterior.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    # Las redirecciones son relativas: nginx no conoce el dominio público (lo sabe Caddy).
    absolute_redirect off;

    error_page 404 /404.html;

    # Astro les pone hash en el nombre: pueden guardarse un año.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # URLs del WordPress anterior que Google tiene indexadas o que alguien pudo guardar.
    location = /acerca-de/ { return 301 /#nosotros; }
    location = /acerca-de  { return 301 /#nosotros; }
    location ~ ^/(contacto|contactanos)/?$ { return 301 /#contacto; }
    location ~ ^/(blog|feed|comments/feed)/?$ { return 301 /; }
    location ~ ^/20[0-9][0-9]/ { return 301 /; }
    location ~ ^/(category|author|tag)/ { return 301 /; }
    # Bots que buscan WordPress: 404 directo, sin redirigir.
    location ~ ^/(wp-admin|wp-login\.php|wp-content|wp-includes|xmlrpc\.php) { return 404; }

    # El HTML cambia con cada publicación: el navegador debe revalidarlo siempre.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/index.html =404;
    }
}
