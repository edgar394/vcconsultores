# Sitio de VC Consultores en la VPS compartida de Elian Corporativo.
#
# No publica puertos: el Caddy compartido (edge_caddy, repo vps-infra; dueño del 80/443)
# termina TLS y le habla por la red interna elian_net. Si este contenedor se cae, Caddy
# responde 502 solo para este sitio; los demás no se enteran.
#
# En la VPS vive en ~/vcconsultores/web/ junto con nginx.conf y current/, que es el dist/
# publicado. Ver docs/runbook-publicar.md.

# Nombre de proyecto fijo. Sin él, Compose usa el de la carpeta (`web`), que es el MISMO que el
# del sitio del hotel (~/aurahost/web), con el mismo servicio `web`: un `up --force-recreate`
# aquí reemplazaría el contenedor del hotel.
name: vcconsultores

services:
  web:
    image: nginx:1.27-alpine
    container_name: vcconsultores_web
    restart: unless-stopped
    volumes:
      - ./current:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - elian_net

networks:
  elian_net:
    name: elian_net
    external: true
